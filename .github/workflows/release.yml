# Triggered by version tags (e.g. v1.0.0 or v1.0.0-rc.1).
# Pipeline: validate → build → GitHub release
name: Release

"on":
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate-quality, validate-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Build (compile-check)
        run: make build

  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="[${VERSION}]" '
            substr($0, 1, 3) == "## " && index($0, ver) > 0 { found=1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md | sed -e 's/^[[:space:]]*$//' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for ${VERSION}. Update CHANGELOG.md before tagging." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if echo "$RELEASE_TAG" | grep -q -- '-'; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG
