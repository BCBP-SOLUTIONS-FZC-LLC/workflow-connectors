# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/workflow-connectors
#
# Same structure as platform-pgcommon's ci.yml, scoped to a library that
# builds no image. Parallel flow (every job below needs `changes`):
#
#   changes ──┬─► validate-test ──────┬──► trivy ─────┐
#             ├─► build-image-cache* ─┘    smoke* ────┤──► pr-summary (PR events only)
#             ├─► validate-quality ───────────────────┤
#             ├─► lint-dockerfile* ───────────────────┤
#             └─► api-compat (informational) ─────────┘
#
#   * no-op placeholders (see below). trivy and smoke need validate-test and
#     build-image, exactly as in platform-pgcommon's ci.yml.
#
# validate-test runs the three suites on the docker-compose stack with -race
# and the coverage gate, and gates trivy (correctness). validate-quality runs
# fmt/tidy/vet/lint/arch-lint/docs-check/CI-script tests/govulncheck and the
# SHA-pinning check. trivy scans go.mod/go.sum (filesystem scan — no image),
# uploads SARIF to the Security tab and publishes a CycloneDX SBOM artifact.
# api-compat reports exported-API changes since the last release (warning
# only; release.yml runs it as a blocking gate). pr-summary posts a status
# table on pull_request events.
#
# `changes` decides whether the expensive jobs run (detect-changes.sh):
#   - a documentation-only change (any *.md, docs/architecture/*.mmd) skips
#     them — docs.yml checks those changes instead;
#   - a draft PR, or a PR labelled "skip-ci", skips them while iterating
#     (never on push: github.event.pull_request.* exists only on PRs).
# The workflow itself always runs, and every job behind a required check is
# skipped by `if:` instead of the whole workflow being filtered out by
# `paths-ignore` — a workflow that never starts never reports its required
# checks, which deadlocks docs-only PRs. A skipped job reports success to
# branch protection. The reusable validate-* workflows get `skip` as an input
# and skip their inner job themselves: skipping the CALLER job would report
# only "Validate / Test", never the required "Validate / Test / test".
#
# "Build image (cache)", "Lint Dockerfile" and "Smoke tests" are no-op
# placeholders — they always succeed and exist only so the org branch-
# protection ruleset resolves. This repo is a pure Go connectors library: no
# Dockerfile, no deployable image, no runtime to smoke-test (so there is no
# image push/Cosign job either). Request an exemption for Dockerfile-less
# repos from org admins when possible; until then, these three stay as
# documented no-ops.
#
# Third-party actions are pinned by commit SHA (`# vX.Y.Z`); keep the comment
# in step when bumping (validate-quality fails on an unpinned action).
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# On a PR, a newer push supersedes the older run (cancelled). On main every
# push gets its own group (keyed by the commit): GitHub cancels a *pending*
# run in a group when a newer one queues even with cancel-in-progress false,
# and a cancelled code commit followed by a docs-only one would never be
# validated on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── docs-only detection + the draft / skip-ci gate ───────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Detect docs-only change
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/detect-changes.sh

      # run = code changed AND (not a PR, or a ready PR without skip-ci).
      - name: Draft / skip-ci gate
        id: gate
        env:
          CODE: ${{ steps.detect.outputs.code }}
          READY: >-
            ${{ github.event_name != 'pull_request' ||
                (github.event.pull_request.draft == false &&
                 !contains(github.event.pull_request.labels.*.name, 'skip-ci')) }}
        run: |
          run=false
          if [ "$CODE" = true ] && [ "$READY" = true ]; then run=true; fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          if [ "$READY" != true ]; then
            echo "Draft PR or skip-ci label — build/test jobs are skipped."
          fi

  # ── runs in parallel with validate-quality ───────────────────────────────
  # Not skipped here (see the header): the reusable workflow skips its job.
  validate-test:
    name: Validate / Test
    needs: changes
    uses: ./.github/workflows/validate-test.yml
    with:
      skip: ${{ needs.changes.outputs.run != 'true' }}
    # Only the secrets validate-test.yml declares (no `secrets: inherit`).
    secrets:
      GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
      CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}

  # ── runs in parallel with validate-test ──────────────────────────────────
  validate-quality:
    name: Validate / Quality
    needs: changes
    uses: ./.github/workflows/validate-quality.yml
    with:
      skip: ${{ needs.changes.outputs.run != 'true' }}
    secrets:
      GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
      CI_REPO_READ_TOKEN: ${{ secrets.CI_REPO_READ_TOKEN }}

  # ── informational: exported-API changes since the last release ──────────
  # Warns (never fails) on an incompatible change: the next version is
  # decided at release time, where release.yml runs the same check blocking.
  api-compat:
    name: API compatibility
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # apidiff loads both trees' packages, so private modules must resolve.
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: API changes since the last release (apidiff)
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: make api-compat

  # ── runs in parallel with validate-test + validate-quality ───────────────
  # Placeholder: no Dockerfile exists in this repo. See header comment. Wired
  # where platform-pgcommon's image build sits (needs `changes`, gates trivy
  # and smoke), so the two pipelines have the same shape.
  build-image-cache:
    name: Build image (cache)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 2
    steps:
      - name: No-op placeholder
        run: echo "workflow-connectors has no Dockerfile/service image — placeholder to satisfy the org branch-protection ruleset. Request a Dockerfile-less-repo exemption when possible."

  # Placeholder: no Dockerfile exists in this repo. See header comment.
  # (platform-pgcommon lints its Dockerfile as the first steps of its image
  # build; the org ruleset's "Lint Dockerfile" check is kept as its own job.)
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 2
    steps:
      - name: No-op placeholder
        run: echo "workflow-connectors has no Dockerfile — placeholder to satisfy the org branch-protection ruleset. Request a Dockerfile-less-repo exemption when possible."

  # ── gates on validate-test + build-image, runs in parallel with trivy ────
  # Placeholder: no genuine runtime/service surface exists in this repo to
  # smoke-test — it's a library consumed by execution_service's connector
  # worker, not a standalone deployable.
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [changes, validate-test, build-image-cache]
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 2
    steps:
      - name: No-op placeholder
        run: echo "workflow-connectors is a library with no runtime to smoke-test — placeholder to satisfy the org branch-protection ruleset. Request a Dockerfile-less-repo exemption when possible."

  # ── gates on validate-test + build-image, runs in parallel with smoke ────
  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [changes, validate-test, build-image-cache]
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      # No image to scan — filesystem scan of go.mod/go.sum.
      # Table format: human-readable in CI logs; fails on CRITICAL/HIGH/UNKNOWN.
      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # tools/go.mod holds golangci-lint, a development tool: its
          # dependencies are not shipped and must not gate a release or
          # appear in the SBOM.
          skip-dirs: tools
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      # SARIF format: uploads to GitHub Security tab.
      - name: Trivy scan — SARIF upload
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # tools/go.mod holds golangci-lint, a development tool: its
          # dependencies are not shipped and must not gate a release or
          # appear in the SBOM.
          skip-dirs: tools
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # CycloneDX SBOM — full dependency inventory for compliance / audit.
      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # tools/go.mod holds golangci-lint, a development tool: its
          # dependencies are not shipped and must not gate a release or
          # appear in the SBOM.
          skip-dirs: tools
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # ── posts or updates a single comment on every PR push ───────────────────
  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [changes, validate-test, validate-quality, api-compat, trivy, build-image-cache, lint-dockerfile, smoke-tests]
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Post or update summary comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_SKIPPED: ${{ needs.changes.outputs.run != 'true' }}
          DOCS_ONLY: ${{ needs.changes.outputs.code != 'true' }}
        with:
          script: |
            const fs = require('fs')
            const code = fs.readFileSync('.github/scripts/pr-summary.js', 'utf8')
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor
            const run = new AsyncFunction('github', 'context', 'core', 'require', 'process', code)
            await run(github, context, core, require, process)
