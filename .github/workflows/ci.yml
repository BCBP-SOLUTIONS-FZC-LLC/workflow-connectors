# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/workflow-connectors

# "Build image (cache)", "Lint Dockerfile", and "Smoke tests" are no-op
# placeholders — they always succeed and exist only so the org branch-
# protection ruleset resolves. This repo is a pure Go connectors library: no
# Dockerfile, no deployable image, no runtime to smoke-test. Request an
# exemption for Dockerfile-less repos from org admins when possible; until
# then, these three stay as documented no-ops.

# ci-gate: lets a draft PR (or a PR labeled "skip-ci") skip the expensive
# jobs below while iterating — never applies on push (a merge to main),
# since github.event.pull_request.* only exists on pull_request events.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        run: >
          echo "run=${{
            github.event_name != 'pull_request' ||
            (github.event.pull_request.draft == false &&
             !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
          }}" >> "$GITHUB_OUTPUT"

  validate-quality:
    name: Validate / Quality
    needs: [ci-gate]
    if: needs.ci-gate.outputs.run == 'true'
    uses: ./.github/workflows/validate-quality.yml

  validate-test:
    name: Validate / Test
    needs: [ci-gate]
    if: needs.ci-gate.outputs.run == 'true'
    uses: ./.github/workflows/validate-test.yml

  # Placeholder: no Dockerfile exists in this repo. See header comment.
  build-image-cache:
    name: Build image (cache)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No-op placeholder
        run: echo "workflow-connectors has no Dockerfile/service image — placeholder to satisfy the org branch-protection ruleset. Request a Dockerfile-less-repo exemption when possible."

  # Placeholder: no Dockerfile exists in this repo. See header comment.
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No-op placeholder
        run: echo "workflow-connectors has no Dockerfile — placeholder to satisfy the org branch-protection ruleset. Request a Dockerfile-less-repo exemption when possible."

  trivy-cve-scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute cache date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy DB cache
        uses: actions/cache@v6
        with:
          path: .trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan dependencies (no image to scan — filesystem/go.sum scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache-dir: .trivy-cache

  # Placeholder: no genuine runtime/service surface exists in this repo to
  # smoke-test — it's a library consumed by execution_service's connector
  # worker, not a standalone deployable.
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No-op placeholder
        run: echo "workflow-connectors is a library with no runtime to smoke-test — placeholder to satisfy the org branch-protection ruleset. Request a Dockerfile-less-repo exemption when possible."

  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name == 'pull_request'
    needs: [ci-gate, validate-quality, validate-test, build-image-cache, lint-dockerfile, trivy-cve-scan, smoke-tests]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post summary
        uses: actions/github-script@v9
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CI_SKIPPED: ${{ needs.ci-gate.outputs.run != 'true' }}
        with:
          script: |
            const results = JSON.parse(process.env.JOB_RESULTS);
            const rows = Object.entries(results)
              .map(([job, info]) => `| ${job} | ${info.result} |`)
              .join('\n');
            const skipNote = process.env.CI_SKIPPED === 'true'
              ? '\n\n_CI gate closed — this PR is a draft or labeled `skip-ci`. Mark it ready for review (or remove the label) to run the full suite._'
              : '';
            const body = `### CI summary\n\n| Job | Result |\n| --- | --- |\n${rows}${skipNote}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
