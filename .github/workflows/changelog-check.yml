# Pre-merge CHANGELOG check.
# Fails if a PR modifies pkg/ or the module's dependencies (go.mod) without
# also updating CHANGELOG.md. This catches missing entries before the release
# workflow, reducing friction at tag time.
name: Changelog check

"on":
  pull_request:
    paths:
      - 'pkg/**'
      - 'go.mod'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: CHANGELOG updated in this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md updated in this PR — OK."
          else
            echo "::error file=CHANGELOG.md,title=CHANGELOG not updated::This PR changes pkg/ or go.mod but does not update CHANGELOG.md. Add an entry under the Unreleased section before merging."
            exit 1
          fi
