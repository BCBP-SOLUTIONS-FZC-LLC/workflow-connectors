# Reusable workflow — test gate.
# Race detector + coverage gate + compile-check.
# Called by ci.yml and release.yml. Gates trivy. Job name must stay "test" —
# combined with the caller job's "Validate / Test" name it produces the
# required branch-protection check "Validate / Test / test".
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
      skip:
        description: >-
          Skip the job (ci.yml: documentation-only change, draft PR or the
          skip-ci label). Skipped here, not at the caller, so the required
          check "<workflow> / <job>" still reports (a skipped job counts as
          success for branch protection).
        type: boolean
        required: false
        default: false
    secrets:
      # The only secrets this workflow reads. Callers pass them explicitly —
      # no `secrets: inherit`, so PR test code never runs with other secrets
      # in scope.
      GO_PRIVATE_TOKEN:
        description: 'Read access to the private BCBP Go modules (platform-pgcommon)'
        required: false
      CI_REPO_READ_TOKEN:
        description: 'Checkout of a private repository (github.token is the fallback)'
        required: false
    outputs:
      pct:
        description: 'Total statement coverage percentage'
        value: ${{ jobs.test.outputs.pct }}
      threshold:
        description: 'Coverage gate threshold percentage'
        value: ${{ jobs.test.outputs.threshold }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: test
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Integration infrastructure comes from docker-compose.yml — the same
    # stack `make docker-up` starts locally: PostgreSQL (direct and through
    # PgBouncer in transaction mode), Valkey with the production persistence
    # settings, and floci S3. The TEST_* values match the compose host ports.
    env:
      TEST_POSTGRES_DSN: postgres://postgres:test@localhost:55432/connectors?sslmode=disable
      TEST_PGBOUNCER_DSN: postgres://postgres:test@localhost:55433/connectors?sslmode=disable
      TEST_VALKEY_ADDR: localhost:56379
      TEST_S3_ENDPOINT: http://localhost:4580
      # The Valkey restart tests run their own containers.
      TEST_VALKEY_DOCKER: "1"
      # Every image (compose and the Valkey restart tests) comes from Google's
      # Docker Hub mirror: anonymous Docker Hub pulls from shared runner IPs
      # hit the pull rate limit (the first v2.0.0 release run failed on it).
      # Images are pinned by digest, so the content is the same.
      WC_REGISTRY: mirror.gcr.io
    outputs:
      pct: ${{ steps.gate.outputs.pct }}
      threshold: ${{ steps.gate.outputs.threshold }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      # Pulled first, with retries, so a registry hiccup is retried rather
      # than failing the gate before any test runs.
      - name: Pull integration images
        run: |
          for attempt in 1 2 3; do
            if docker compose pull --quiet; then exit 0; fi
            echo "::warning title=Image pull::attempt ${attempt} failed — retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          echo "::error title=Image pull::could not pull the integration images from ${WC_REGISTRY}"
          exit 1

      - name: Start integration infrastructure
        run: docker compose up -d --wait

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      # Store credentials so go mod download can fetch private BCBP modules
      # (platform-pgcommon). Mirrors iam-org-membership and platform-events
      # (secrets.GO_PRIVATE_TOKEN, an org-level secret).
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # Mandatory blocking gate: runs the unit, postgres and integration suites
      # in parallel with -race, each with its own coverage profile, merged into
      # coverage.out (scripts/merge_coverage.py, as iam-org-membership). Any
      # data race detected here blocks trivy and the release. Do NOT remove or
      # skip.
      - name: Tests (race + coverage)
        run: make test-ci

      # Total statement coverage across pkg/... must meet COVERAGE_THRESHOLD.
      # This is a ratchet: raise it as coverage improves, never lower it.
      - name: Coverage threshold gate
        id: gate
        env:
          COVERAGE_THRESHOLD: '98'
        run: bash .github/scripts/coverage-gate.sh

      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 30

      - name: Build (compile-check)
        run: make build
